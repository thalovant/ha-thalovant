name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces the run; main keeps every run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action runs the ghcr.io/home-assistant/hassfest image, which follows
      # Home Assistant's dev branch; the pin covers the wrapper only.
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Reads the repository through the API with the job token; no checkout.
      # Runs ghcr.io/hacs/action:main; the pin covers the wrapper only.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Home Assistant 2026.9 requires Python 3.14.2 or later.
          python-version: "3.14"
      # uv resolves and installs the ~150 packages Home Assistant needs in seconds, where
      # pip takes minutes; no dependency cache is kept.
      - name: Install
        run: |
          python -m pip install uv==0.12.19
          uv pip install --system -r requirements_test.txt -r requirements_lint.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing
