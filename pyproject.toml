[project]
name = "ha-thalovant"
version = "0.1.0"
description = "Home Assistant integration that lets a Thalovant hub ask Assist to act on your home"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
filterwarnings = [
  "error::RuntimeWarning",
]

[tool.coverage.run]
source = ["custom_components.thalovant"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["deprecated", "explicit-override", "ignore-without-code", "redundant-self", "truthy-iterable"]
disable_error_code = ["import-untyped"]
explicit_package_bases = true
mypy_path = ".:tests/stubs"
packages = ["custom_components.thalovant"]

[tool.ruff]
required-version = ">=0.16.8"
target-version = "py314"

[tool.ruff.lint]
# The subset of Home Assistant core's rule set that applies outside its tree.
select = [
  "A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ003", "DTZ004", "DTZ011",
  "E", "F", "FLY", "FURB", "G", "I", "ICN001", "ICN002", "ISC", "LOG",
  "N804", "N805", "N806", "N815", "PERF", "PGH", "PIE", "PL", "PT", "PTH",
  "PYI", "RET", "RSE", "RUF", "S102", "S103", "S108", "S307", "SIM", "SLF",
  "SLOT", "T100", "T20", "TC", "TID", "TRY", "UP", "W",
]
logger-objects = ["custom_components.thalovant.const.LOGGER"]
ignore = [
  "ASYNC109",
  "D202", "D203", "D213", "D406", "D407", "D417", "E501",
  "PLC1901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
  "PT011", "PT018", "RUF001", "RUF012",
  "SIM102", "SIM103", "SIM108",
  "TC001", "TC002", "TC003", "TC006",
  "TRY003", "TRY400",
  "W191", "E111", "E114", "E117", "D206", "D300", "Q", "COM812", "COM819",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "SLF001", "PLC0415"]

[tool.ruff.lint.flake8-import-conventions.banned-aliases]
"probatio" = ["vol"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"voluptuous".msg = "use probatio instead"
"__future__.annotations".msg = "Home Assistant requires Python 3.14+"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
known-third-party = ["aiothalovant"]
combine-as-imports = true
split-on-trailing-comma = false
