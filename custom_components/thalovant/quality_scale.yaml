rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate-polling:
    status: exempt
    comment: Push only. The hub connection reports its own state and requests arrive over it.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: >
      The thalovant SDK is MIT-licensed, public, and released to PyPI from CI;
      the manifest pins thalovant==0.9.1.
  docs-actions:
    status: exempt
    comment: The integration registers no service actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no service actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >
      The only entity is the hub connection itself. It reports off, not unavailable,
      when the link drops, because off is the answer it exists to give.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: A cloud service; there is nothing on the network to discover.
  discovery:
    status: exempt
    comment: A cloud service; there is nothing on the network to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each entry is one hub, so one device, known at setup.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The one entity, the hub connection, changes rarely and is how users see the link works.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: todo
    comment: >
      The hub is the only setup choice and it is part of the entry's unique ID, so moving
      to another hub means removing the entry and adding a new one. Credentials are renewed
      through reauthentication, and the conversation agent through the options.
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Each entry has exactly one device, removed with the entry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
