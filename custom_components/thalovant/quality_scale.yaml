rules:
  # Bronze
  action-setup:
    status: done
    comment: >
      The announce, cancel_announcement and list_speakers actions are registered once,
      in async_setup(), so a call the options do not allow gets a clear error.
  appropriate-polling:
    status: exempt
    comment: >
      Push only. The hub connection reports its own state and requests arrive over it.
      The one exception is an urgent announcement that is still sending: it is read every
      five seconds until it ends, for as long as it can last.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: >
      The thalovant SDK is MIT-licensed, public, and released to PyPI from CI;
      the manifest pins thalovant==0.12.0, the first release with Intercom.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >
      Actions raise ServiceValidationError for what the caller can fix and
      HomeAssistantError for what happened on the way, both with translations and
      never the announcement's text.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >
      The only entity is the hub connection itself. It reports off, not unavailable,
      when the link drops, because off is the answer it exists to give.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: A cloud service; there is nothing on the network to discover.
  discovery:
    status: exempt
    comment: A cloud service; there is nothing on the network to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each entry is one hub, so one device, known at setup.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: >
      The Intercom notify entity is disabled by default. The hub connection sensor is
      not: it changes rarely and is how users see the link works.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: todo
    comment: >
      The hub is the only setup choice and it is part of the entry's unique ID, so moving
      to another hub means removing the entry and adding a new one. Credentials are renewed
      through reauthentication, and the conversation agent through the options.
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Each entry has exactly one device, removed with the entry.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
